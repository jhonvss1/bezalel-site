<style>
*{box-sizing:border-box}html,body{margin:0}
body{width:1080px;height:1350px;overflow:hidden;font-family:Karla,sans-serif;position:relative}
.night{background:#241810;color:#E4D3B5}.kraft{background:#E4D3B5;color:#241810}
.top{position:absolute;top:80px;left:96px;right:96px;display:flex;justify-content:space-between;align-items:center;font-size:30px}
.mark{display:flex;align-items:center;gap:16px;font-family:'Young Serif',serif;font-size:40px}
.mark span{display:inline-block;transform:rotate(-1.5deg)}
.kraft .mark path[stroke]{stroke:#6F4A2E}
.count{font-weight:700;opacity:.6;letter-spacing:.05em}
.body{position:absolute;left:96px;right:96px;top:50%;transform:translateY(-55%)}
.eyebrow{font-weight:700;font-size:34px;margin:0 0 32px}
.night .eyebrow{color:#D6A97C}.kraft .eyebrow{color:#6F4A2E}
.eyebrow::before{content:"— "}
h1{font-family:'Young Serif',serif;font-weight:400;font-size:96px;line-height:1.06;margin:0}
p{font-size:42px;line-height:1.4;margin:40px 0 0;max-width:840px}
.night p{color:#C9B49A}.kraft p{color:#5E4632}
.hl{color:#D6A97C}.kraft .hl{color:#6F4A2E}
.chips{display:flex;flex-wrap:wrap;gap:20px;margin-top:56px}
.chips span{font-family:'Young Serif',serif;font-size:44px;padding:14px 30px;border:3px solid #6F4A2E;color:#D6A97C}
.chips span:nth-child(odd){transform:rotate(-1.5deg)}.chips span:nth-child(even){transform:rotate(1.2deg)}
.edge{position:absolute;left:0;bottom:0;width:1080px;height:70px}
.night .edge path{fill:#E4D3B5}.kraft .edge path{fill:#241810}
.swipe{position:absolute;bottom:120px;right:96px;font-size:30px;font-weight:700;opacity:.7}

<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700;800&family=Caveat:wght@600&display=block" rel="stylesheet">
<style>
*{box-sizing:border-box}html,body{margin:0}
body{width:1080px;height:1350px;overflow:hidden;background:#1a1a2e;color:#fff;font-family:Inter,sans-serif;position:relative}
.glow{position:absolute;width:900px;height:900px;right:-420px;top:-420px;border-radius:50%;background:radial-gradient(circle,rgba(245,158,11,.18),rgba(245,158,11,0) 65%)}
.top{position:absolute;top:80px;left:88px;right:88px;display:flex;justify-content:space-between;align-items:center}
.brand{display:flex;align-items:center;gap:16px;font-family:'Plus Jakarta Sans';font-weight:800;font-size:36px}
.logo{width:56px;height:56px;border-radius:12px;background:#000;display:grid;place-items:center;font-family:Georgia,serif;font-weight:700;font-size:38px;color:#f59e0b;padding-top:3px}
.count{font-weight:600;font-size:28px;color:#8e91a8;letter-spacing:.05em}
.body{position:absolute;left:88px;right:88px;top:50%;transform:translateY(-50%)}
.eyebrow{font-weight:600;font-size:30px;color:#f59e0b;letter-spacing:.08em;text-transform:uppercase;margin-bottom:28px}
h1{font-family:'Plus Jakarta Sans';font-weight:800;font-size:84px;line-height:1.08;letter-spacing:-.02em;margin:0}
h1 em{font-style:normal;color:#f59e0b}
p{font-size:38px;line-height:1.5;color:#c3c5d8;margin:36px 0 0;max-width:880px}
p b{color:#fff;font-weight:600}
.bubble{display:inline-block;background:#25263f;border:2px solid rgba(255,255,255,.08);border-radius:28px 28px 28px 8px;padding:22px 32px;font-size:36px;margin-top:20px}
.paper{background:#f4efe3;color:#2a2a3a;border-radius:6px;padding:36px 44px;transform:rotate(-2deg);box-shadow:0 24px 60px rgba(0,0,0,.45);font-family:Caveat,cursive;font-size:50px;line-height:1.35;width:600px;position:relative}
.paper div{border-bottom:2px solid #d8cfbb}
.paper s{color:#9a8f7a}
.pin{position:absolute;top:-16px;left:50%;width:32px;height:32px;border-radius:50%;background:#c0392b;box-shadow:0 4px 8px rgba(0,0,0,.4)}
.quote{font-family:'Plus Jakarta Sans';font-weight:700;font-size:60px;color:#f59e0b;border-left:8px solid #f59e0b;padding-left:36px;margin-top:48px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:48px}
.stat{background:rgba(255,255,255,.06);border:2px solid rgba(255,255,255,.1);border-radius:24px;padding:32px}
.stat b{display:block;font-family:'Plus Jakarta Sans';font-weight:800;font-size:96px;color:#f59e0b;line-height:1}
.stat span{display:block;font-size:30px;color:#c3c5d8;margin-top:12px;line-height:1.35}
.cta{display:flex;align-items:center;gap:32px;margin-top:56px}
.btn{background:#f59e0b;color:#1a1a2e;font-family:'Plus Jakarta Sans';font-weight:800;font-size:38px;padding:24px 44px;border-radius:999px}
.by{font-size:26px;color:#8e91a8;line-height:1.45}.by b{color:#c3c5d8;font-weight:600}
.swipe{position:absolute;bottom:90px;right:88px;font-size:28px;font-weight:600;color:#8e91a8}
</style></head><body><div class="glow"></div>
<div class="top"><div class="brand"><div class="logo">B</div>Braggo</div><div class="count">6/6</div></div>
<div class="body"><div class="eyebrow">O resultado</div><h1>O papel saiu da parede.</h1>
<div class="stats"><div class="stat"><b>150+</b><span>clientes, entre cadastrados e avulsos</span></div><div class="stat"><b>250+</b><span>agendamentos feitos pela Braggo</span></div></div>
<p>E muito tempo de volta, que antes ia pra caneta e pro caderno.</p>
<div class="cta"><div class="btn">Teste grátis · link na bio</div></div>
<div class="by" style="margin-top:28px">uma solução <b>Bezalel</b></div></div>
</body></html>
